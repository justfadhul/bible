<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A two-person daily Bible reading wheel. Spin, read the passage, discuss." />
    <meta name="theme-color" content="#f5f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>The Spin Catalog</title>
    <script id="theme-bootstrap">
      // Stamp the saved appearance before first paint. Without this the page
      // renders in the system appearance for a frame and then snaps to the
      // chosen one — the flash every theme-switching app is judged by.
      try {
        var t = localStorage.getItem('spin-catalog:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
